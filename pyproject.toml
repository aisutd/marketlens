[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketlens"
version = "0.1.0"
description = "Amazon U.S. product financial-performance prediction (units, revenue, profit, margin, ROI, break-even, demand)"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.5", "joblib>=1.3"]

[project.optional-dependencies]
notebooks = ["jupyter", "matplotlib", "seaborn", "nbformat", "nbconvert", "pyarrow"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
