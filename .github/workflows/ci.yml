# Checks for every pull request into main (#43).
#
# Safety: pull_request (not pull_request_target), so a fork's PR runs with a
# read-only token and no secrets. The token is read-only here as well, the
# checkout does not keep it, and every action is an official actions/* release
# pinned to a full commit SHA (the tag is in the comment), so a moved tag cannot
# change what runs.
#
# Only tests that need no gitignored model files run here: the model-dependent
# suites (marked `models` in sales_forecast; most of product_success/api/tests)
# still have to be run locally. See each README.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, build, checks, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The browser tests (test:login-return and others) drive Chromium.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check category map
        run: npm run check:categories

      - name: Check score factors
        run: npm run check:score-factors

      # Every test:* script in package.json, so a new test file only needs its
      # script to be picked up here.
      - name: Tests
        run: |
          for script in $(node -e 'for (const s of Object.keys(require("./package.json").scripts)) if (s.startsWith("test:")) console.log(s)'); do
            echo "::group::npm run $script"
            npm run "$script"
            echo "::endgroup::"
          done

  sales-forecast:
    name: Forecasting API (model-free tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sales_forecast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: sales_forecast/requirements-api.txt

      # requirements-api.txt is what the container installs; pytest and httpx at
      # the versions pinned in requirements.txt. The test modules import FastAPI,
      # firebase-admin and slowapi even when their tests are skipped.
      - name: Install dependencies
        run: pip install -r requirements-api.txt pytest==9.1.1 httpx==0.28.1

      - name: Tests (not marked models)
        run: python -m pytest -m "not models" -q

  product-success:
    name: Scoring API (model-free tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: product_success
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            product_success/api/requirements-api.txt
            product_success/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r api/requirements-api.txt -r api/requirements-dev.txt

      # The other suites load the gitignored model files. test_demo_security
      # checks the auth and retired-route guarantees without them.
      - name: Tests (security, no models needed)
        run: python -m pytest api/tests/test_demo_security.py -q
